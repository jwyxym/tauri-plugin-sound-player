[package]
name = "tauri-plugin-sound-player"
version = "0.1.1"
edition = "2024"
links = "tauri-plugin-sound-player"
license = "MIT"
authors = ["jwyxym <jwyxym@126.com>"]
description = "A Tauri plugin for cross-platform mp3/ogg/wav sound playback."
keywords = ["tauri", "plugin", "sound", "audio"]
repository = "https://github.com/jwyxym/tauri-plugin-sound-player"
readme = "README.md"

[build-dependencies]
tauri-plugin = { version = "2.0.1", features = ["build"] }

[dependencies]
parking_lot = "0.12"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "vorbis", "wav"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.4" }
thiserror = "1.0"